<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab organizer rules</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <main>
      <header class="options-header">
        <div class="options-header-row">
          <h1>Organization rules</h1>
        </div>
        <p>Rules run from top to bottom. The first matching rule wins.</p>
        <div class="mode-banner">
          <p id="mode-text"></p>
          <div class="actions">
            <button id="copy-defaults" type="button" hidden>Copy defaults to my rules</button>
            <button id="start-empty" type="button" hidden>Start empty</button>
            <button id="revert-defaults" class="danger" type="button" hidden>Revert to defaults</button>
          </div>
        </div>
        <div class="options-rule-actions">
          <div class="actions">
            <button id="add-rule" type="button" hidden>Add rule</button>
            <button id="save-rules" type="button" hidden>Save rules</button>
            <button id="export-rules" type="button">Export rules</button>
          </div>
          <p id="status" role="status"></p>
        </div>
        <section aria-labelledby="import-heading">
          <h2 id="import-heading">Import rules</h2>
          <div class="options-import-actions">
            <input id="import-file" type="file" accept="application/json,.json" />
            <div class="actions">
              <button id="collapse-all" type="button">Collapse all</button>
              <button id="expand-all" type="button">Expand all</button>
            </div>
          </div>
          <div id="import-preview" hidden>
            <h3>Added</h3><ul id="import-added"></ul>
            <h3>Changed</h3><ul id="import-changed"></ul>
            <h3>Removed</h3><ul id="import-removed"></ul>
            <button id="apply-import" type="button" disabled>Replace saved rules</button>
          </div>
        </section>
      </header>
      <div class="options-content">
        <ol id="rules"></ol>
        <section id="default-groups" aria-labelledby="default-groups-heading" hidden>
          <h2 id="default-groups-heading">Default groups</h2>
          <p>
            Copy a group into your rules. Copies go to the end of your list and
            stay unsaved until you save. Rules you already have are skipped.
          </p>
          <ul id="default-group-list"></ul>
        </section>
      </div>
    </main>

    <template id="rule-template">
      <li class="rule">
        <div class="rule-header">
          <button class="toggle-rule" type="button" aria-expanded="true">Collapse</button>
          <span class="rule-heading">
            <strong class="rule-summary"></strong>
            <small class="rule-color-summary"></small>
          </span>
          <div class="actions">
            <button class="move-up" type="button">Move up</button>
            <button class="delete-rule" type="button">Delete</button>
          </div>
        </div>
        <div class="rule-fields">
          <label>Name <input class="rule-name" type="text" required /></label>
          <label>
            Color
            <select class="rule-color">
              <option>grey</option><option>blue</option><option>red</option>
              <option>yellow</option><option>green</option><option>pink</option>
              <option>purple</option><option>cyan</option><option>orange</option>
            </select>
          </label>
          <label>Hostnames, one per line <textarea class="rule-hostnames"></textarea></label>
          <label>URL text, one per line <textarea class="rule-urls"></textarea></label>
          <label>Title text, one per line <textarea class="rule-titles"></textarea></label>
          <details class="rule-exclude">
            <summary>Don't include (<span class="exclude-count">0</span>)</summary>
            <label>Hostnames, one per line <textarea class="rule-exclude-hostnames"></textarea></label>
            <label>URL text, one per line <textarea class="rule-exclude-urls"></textarea></label>
            <label>Title text, one per line <textarea class="rule-exclude-titles"></textarea></label>
          </details>
        </div>
        <div class="rule-footer">
          <small class="rule-condensed"></small>
          <button class="move-down" type="button">Move down</button>
        </div>
      </li>
    </template>
    <script type="module" src="options.js"></script>
  </body>
</html>
